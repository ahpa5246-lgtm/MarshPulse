name: MarshNet V2 — Real Satellite Monthly Research
on:
  workflow_dispatch:
  schedule:
    # Only one monthly research run; last complete month, no future imagery.
    - cron: '17 4 10 * *'
  push:
    paths:
      - .github/workflows/real-satellite-pilot.yml
permissions:
  contents: read
jobs:
  genuine-imagery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install satellite acquisition and CPU ML dependencies
        run: |
          python -m pip install -q "numpy>=1.26,<3" "rasterio>=1.3,<2" "pystac-client>=0.8,<1" "planetary-computer>=1.0,<2"
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Select last 36 complete calendar months — deterministic temporal split
        run: |
          python - <<'PY'
          from datetime import datetime,timezone
          from pathlib import Path
          import os
          now=datetime.now(timezone.utc)
          last=now.year*12+now.month-2
          first=last-35
          fmt=lambda n:f"{n//12:04d}-{n%12+1:02d}"
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write(f"MARSH_START={fmt(first)}\nMARSH_END={fmt(last)}\n")
          print("Closed-month window:",fmt(first),"to",fmt(last))
          PY
      - name: Fetch REAL ESA Sentinel-2 near Hawizeh KBA — not Ramsar polygon
        run: |
          python ml/collect_sentinel.py \
            --bbox 47.64 31.53 47.74 31.63 \
            --start "$MARSH_START" --end "$MARSH_END" \
            --pixels 64 --max-scenes 2 --min-coverage 0.20 \
            --out /tmp/marshpulse-sentinel
      - name: Audit coverage, water prevalence and class-collapse risks
        run: |
          python ml/quality_gate.py \
            --input /tmp/marshpulse-sentinel/hawizeh_s2_monthly.npz \
            --out /tmp/marshpulse-training/quality_audit.json
      - name: Produce actual monthly water monitoring, area-change and CSV evidence
        run: |
          python ml/monitor_wetland.py \
            --input /tmp/marshpulse-sentinel/hawizeh_s2_monthly.npz \
            --manifest /tmp/marshpulse-sentinel/satellite_manifest.json \
            --out /tmp/marshpulse-monitor
      - name: Train and benchmark residual ConvGRU on genuine imagery
        run: |
          python ml/train_satellite.py \
            --input /tmp/marshpulse-sentinel/hawizeh_s2_monthly.npz \
            --out /tmp/marshpulse-training \
            --base 16 --lookback 4 --epochs 12 --patience 5 \
            --batch 2 --min-valid 0.20 --cpu
      - name: Preserve real-data audit, metrics, model and scene provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hawizeh-monthly-research-unverified
          path: |
            /tmp/marshpulse-sentinel/satellite_manifest.json
            /tmp/marshpulse-sentinel/hawizeh_s2_monthly.npz
            /tmp/marshpulse-training/quality_audit.json
            /tmp/marshpulse-monitor/water_monitor.csv
            /tmp/marshpulse-monitor/water_monitor.json
            /tmp/marshpulse-training/evaluation.json
            /tmp/marshpulse-training/marshnet_v2.pt
            /tmp/marshpulse-training/test_predictions.npz
          if-no-files-found: warn
          retention-days: 90
