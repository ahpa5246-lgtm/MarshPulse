name: MarshNet V2 — Real Satellite Pilot
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/real-satellite-pilot.yml
permissions:
  contents: read
jobs:
  genuine-imagery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real imagery access and CPU deep learning
        run: |
          python -m pip install -q "numpy>=1.26,<3" "rasterio>=1.3,<2" "pystac-client>=0.8,<1" "planetary-computer>=1.0,<2"
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Read actual ESA Sentinel-2 from a Hawizeh PILOT AOI
        run: |
          python ml/collect_sentinel.py --bbox 47.55 31.50 47.65 31.60 --start 2024-01 --end 2025-12 --pixels 64 --max-scenes 1 --min-coverage 0.20 --out /tmp/marshpulse-sentinel
      - name: Train and score real-satellite proxy on chronological test
        run: |
          python ml/train_satellite.py --input /tmp/marshpulse-sentinel/hawizeh_s2_monthly.npz --out /tmp/marshpulse-training --base 16 --lookback 4 --epochs 8 --batch 2 --cpu
      - name: Upload provenance, metrics and checkpoint only if genuinely produced
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hawizeh-real-satellite-v2-pilot
          path: |
            /tmp/marshpulse-sentinel/satellite_manifest.json
            /tmp/marshpulse-training/evaluation.json
            /tmp/marshpulse-training/marshnet_v2.pt
          retention-days: 30
