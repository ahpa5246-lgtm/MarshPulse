name: Scientific Core CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  engine-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/engine.mjs
          node --check src/app.mjs
          node --check src/model-studio.mjs
          node --check src/floating-nav.mjs
          node --check earth-engine/export_monthly_grid.js
          python3 -m py_compile ml/train.py
          python3 -m py_compile ml/collect_sentinel.py ml/train_satellite.py ml/marshnet_v2.py ml/quality_gate.py ml/monitor_wetland.py ml/calibration.py ml/train_v3.py ml/marshnet_v3.py ml/judge_readiness.py ml/mash_plus_smp.py ml/landsat_crosscheck.py ml/prepare_field_review.py ml/daily_train.py ml/daily_bundle.py ml/change_diagnostics.py ml/paired_evidence.py ml/nasa_power_context.py ml/forecast_next_month.py ml/human_reference_evaluation.py scripts/mash_plus_daily_bridge.py
          python3 - <<'PY'
          import json
          n=json.load(open("kaggle/marshnet_v2_hawizeh.ipynb"))
          v=json.load(open("kaggle/MarshPulse_V3_GeoHoldout_GPU.ipynb"))
          v4=json.load(open("kaggle/Mash_Plus_V4_Independent_Dalmaj_GPU.ipynb"))
          daily=json.load(open("kaggle/Mash_Plus_Daily_Trainer.ipynb"))
          assert n["nbformat"] == v["nbformat"] == v4["nbformat"] == daily["nbformat"] == 4
          assert len(n["cells"]) >= 10 and len(v["cells"]) >= 12 and len(v4["cells"]) >= 15 and len(daily["cells"]) >= 8
          import ast
          for study in (v,v4,daily):
           for number, cell in enumerate(study["cells"]):
               if cell["cell_type"] != "code":
                   continue
               source = "".join(cell["source"])
               stripped = "\n".join(line for line in source.splitlines()
                                   if not line.lstrip().startswith(("%", "!")))
               try:
                   ast.parse(stripped, filename=f"Kaggle notebook cell {number}")
               except SyntaxError as exc:
                   raise AssertionError(f"Invalid executable notebook cell {number}") from exc
          PY
      - name: Reproducible unit tests
        run: node --test tests/*.test.mjs
      - name: Satellite dataset quality and benchmark unit tests
        run: |
          python3 -m pip install --quiet "numpy>=1.26,<3"
          python3 -m unittest discover -s tests -p 'test_*quality.py' -v
          python3 -m unittest discover -s tests -p 'test_wetland_monitor.py' -v
          python3 -m unittest discover -s tests -p 'test_calibration.py' -v
  model-training-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU training runtime
        run: |
          python -m pip install -q "numpy>=1.26,<3"
          python -m pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q "segmentation-models-pytorch>=0.4,<1"
      - name: End-to-end synthetic fixture (NEVER real scientific evidence)
        run: |
          python ml/train_satellite.py --synthetic-smoke \
            --input /tmp/marshpulse-synthetic/fixture.npz \
            --out /tmp/marshpulse-synthetic/out \
            --base 8 --epochs 2 --batch 2 --lookback 4 --cpu
          python -m unittest discover -s tests -p 'test_v3.py' -v
          python -m unittest discover -s tests -p 'test_judge_readiness.py' -v
          python -m unittest discover -s tests -p 'test_landsat_crosscheck.py' -v
          python -m unittest discover -s tests -p 'test_field_review.py' -v
          python -m unittest discover -s tests -p 'test_v4_smp.py' -v
          python -m unittest discover -s tests -p 'test_daily_continuation.py' -v
          python -m unittest discover -s tests -p 'test_change_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_transition_training.py' -v
          python -m unittest discover -s tests -p 'test_paired_evidence.py' -v
          python -m unittest discover -s tests -p 'test_nasa_power_context.py' -v
          python -m unittest discover -s tests -p 'test_forecast_next_month.py' -v
          python -m unittest discover -s tests -p 'test_human_reference_evaluation.py' -v
          python ml/train_v3.py --synthetic-smoke \
            --train-input /tmp/marshpulse-v3/fixture.npz \
            --spatial-test-input /tmp/marshpulse-v3/spatial-fixture.npz \
            --out /tmp/marshpulse-v3/result \
            --base 8 --epochs 1 --batch 2 --seeds 17 --cpu
          python - <<'PY'
          import json
          from pathlib import Path
          a=Path("/tmp/marshpulse-synthetic/out")
          report=json.loads((a/"evaluation.json").read_text())
          assert report["status"]=="SYNTHETIC SMOKE ONLY"
          assert report["scientific_readiness_gate"]["ready_for_operational_or_ecological_decisions"] is False
          assert "seasonal_12m" in report["same_pixel_model_vs_both_baselines"]["metrics"]
          assert "persistence" in report["same_pixel_model_vs_both_baselines"]["metrics"]
          assert "calibration_fit_on_validation_only" in report
          assert "uncalibrated_same_pixel_baselines" in report
          v3=json.loads(Path("/tmp/marshpulse-v3/result/v3_evaluation.json").read_text())
          assert v3["status"]=="SYNTHETIC TEST ONLY"
          assert v3["operationally_reliable"] is False
          assert "selected_champion" in v3
          assert len(v3["test_evaluations"])==2
          assert v3["spatial_transfer_evaluated"] is True
          assert all(e["months_with_shared_observations"]>0 for e in v3["test_evaluations"])
          print("V3_CHALLENGER_GEO_HOLDOUT_SMOKE_SUCCESS: no false field-validation claim")
          assert (a/"marshnet_v2.pt").stat().st_size>0
          print("TRAINING_PIPELINE_SMOKE_SUCCESS; synthetic only, no scientific accuracy established")
          PY
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: npm install --no-save playwright@1.56.1 axe-core@4.10.3
      - name: Verify actual browser flow
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/marshpulse-web.log 2>&1 &
          sleep 2
          node tests/browser-smoke.mjs
          node tests/accessibility-audit.mjs
      - name: Upload browser evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marshpulse-browser-proof
          path: artifacts/
          if-no-files-found: ignore
