name: Scientific Core CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  engine-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/engine.mjs
          node --check src/app.mjs
          node --check earth-engine/export_monthly_grid.js
      - name: Reproducible unit tests
        run: node --test tests/*.test.mjs
