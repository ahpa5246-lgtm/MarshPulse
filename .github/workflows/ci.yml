name: Scientific Core CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  engine-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/engine.mjs
          node --check src/app.mjs
          node --check earth-engine/export_monthly_grid.js
          python3 -m py_compile ml/train.py
          python3 -m py_compile ml/collect_sentinel.py ml/train_satellite.py ml/marshnet_v2.py ml/quality_gate.py
          python3 -c "import json; n=json.load(open('kaggle/marshnet_v2_hawizeh.ipynb')); assert n['nbformat']==4 and len(n['cells'])>=10"
      - name: Reproducible unit tests
        run: node --test tests/*.test.mjs
      - name: Satellite dataset quality and benchmark unit tests
        run: |
          python3 -m pip install --quiet "numpy>=1.26,<3"
          python3 -m unittest discover -s tests -p 'test_*quality.py' -v
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: npm install --no-save playwright@1.56.1
      - name: Verify actual browser flow
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/marshpulse-web.log 2>&1 &
          sleep 2
          node tests/browser-smoke.mjs
      - name: Upload browser evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marshpulse-browser-proof
          path: artifacts/
          if-no-files-found: ignore
