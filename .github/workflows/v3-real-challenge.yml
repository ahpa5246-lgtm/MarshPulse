name: MarshNet V3 — Real-data challenger smoke and comparison
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Previously verified real Sentinel-2 GitHub Actions run with source NPZ and manifest"
        required: false
        default: "40064994264"
  push:
    paths:
      - .github/workflows/v3-real-challenge.yml
permissions:
  contents: read
  actions: read
jobs:
  audited-challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual CPU PyTorch
        run: |
          python -m pip install -q "numpy>=1.26,<3"
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Retrieve independently verified REAL imagery (not synthetic)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id || '40064994264' }}
        run: |
          mkdir -p /tmp/verified-source
          gh run download "$SOURCE_RUN" --repo "${{ github.repository }}" \
            --name hawizeh-monthly-research-unverified \
            --dir /tmp/verified-source
          find /tmp/verified-source -type f | sort
          DATA="$(find /tmp/verified-source -name hawizeh_s2_monthly.npz -type f | head -1)"
          test -n "$DATA"
          test -s "$(dirname "$DATA")/satellite_manifest.json"
          echo "DATA_PATH=$DATA" >> "$GITHUB_ENV"
      - name: V3 multi-seed genuine image training / temporal holdout
        run: |
          python ml/train_v3.py \
            --train-input "$DATA_PATH" \
            --out /tmp/v3-real-challenge --base 8 \
            --epochs 8 --patience 3 --batch 2 \
            --seeds 17,42 --cpu
          python - <<'PY'
          import json
          p="/tmp/v3-real-challenge/v3_evaluation.json"
          r=json.load(open(p))
          assert r["status"].startswith("REAL SATELLITE PROXY")
          assert r["operationally_reliable"] is False
          assert len(r["selected_champion"]["validation_challengers"])==2
          assert r["test_evaluations"]
          for e in r["test_evaluations"]:
              s=e["metrics"]
              print("REGION",e["region"],"CHAMPION",r["selected_champion"]["type"],
                    "model",s["model"]["brier"],"persistence",s["persistence"]["brier"])
          PY
      - name: Preserve real-data V3 scores (negative results included)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marshnet-v3-verified-image-challenge
          path: /tmp/v3-real-challenge/
          retention-days: 90
          if-no-files-found: warn
