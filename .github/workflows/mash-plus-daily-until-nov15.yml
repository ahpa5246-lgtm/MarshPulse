name: Mash Plus - 4 daily Kaggle GPU sessions to 15 Nov 2026

on:
  schedule:
    # Four sequential 30-minute *training loop* targets, Baghdad local:
    # 05:15, 09:15, 13:15, 17:15. Runs only when prior Kaggle GPU finishes.
    # Availability/quota may skip sessions; Python rejects dates after Nov 15.
    - cron: '15 2 * * *'
    - cron: '15 6 * * *'
    - cron: '15 10 * * *'
    - cron: '15 14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/mash-plus-daily-first-run.txt'

concurrency:
  group: mash-plus-daily-kaggle-single-writer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  continue-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE }}
      RUN_CRON: ${{ github.event.schedule }}
    steps:
      - name: Checkout exact scientific implementation
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Kaggle client (single secret KGAT_)
        run: |
          python -m pip install -q --disable-pip-version-check 'kaggle==2.2.5'
      - name: Reconcile prior completed model and launch ONE Kaggle version
        shell: bash
        run: |
          set -euo pipefail
          python scripts/mash_plus_daily_bridge.py \
            --slot "$RUN_CRON" \
            --work "$RUNNER_TEMP/mash-plus-private"
      - name: Explain verification scope
        if: success()
        run: |
          echo 'A green GitHub run proves only the scheduled bridge worked.'
          echo 'Four local Baghdad slots target ~120 minutes of training loops/day.'
          echo 'The actual measured minutes depend on quota, training speed and availability.'
          echo 'Inspect the private Kaggle kernel status, its real source commit,'
          echo 'training report and incremented epochs before claiming continuation.'
          echo 'Scientific status remains RESEARCH_ONLY until external reference tests.'
